<section class="section cta-section">
  <div class="container">
    <div class="cta-band reveal">
      <div class="cta-glow" aria-hidden="true"></div>
      <div class="cta-rings" aria-hidden="true"><span></span><span></span><span></span></div>
      <p class="eyebrow eyebrow-light"><svg class="i"><use href="#i-sparkle"/></svg> ₹0 setup · ₹0 monthly · full support</p>
      <h2 class="cta-title">Join us today and start your shop's <em>digital journey.</em></h2>
      <p class="cta-sub">Tell us about your shop. Our team calls you, adds every product for you and stays with you 24/7.</p>
      <div class="cta-actions">
        <a class="btn btn-light btn-lg" href="contact.html#join" data-magnetic>Join free today <svg class="i"><use href="#i-arrow"/></svg></a>
        {{#if whatsappUrl}}<a class="btn btn-glass btn-lg" href="{{whatsappUrl}}" target="_blank" rel="noopener"><svg class="i"><use href="#i-whatsapp"/></svg> Chat on WhatsApp</a>{{else}}<a class="btn btn-glass btn-lg" href="{{signupUrl}}">Create your shop now</a>{{/if}}
      </div>
    </div>
  </div>
</section>
