<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  {{#if page.noindex}}<base href="{{basePath}}">{{/if}}
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{page.title}}</title>
  <meta name="description" content="{{page.description}}">
  <link rel="canonical" href="{{site.url}}/{{page.path}}">
  <meta name="theme-color" content="#0d0c1d">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{site.name}}">
  <meta property="og:title" content="{{page.title}}">
  <meta property="og:description" content="{{page.description}}">
  <meta property="og:url" content="{{site.url}}/{{page.path}}">
  <meta property="og:image" content="{{site.url}}/assets/img/og.png">
  <meta name="twitter:card" content="summary_large_image">
  {{#if page.noindex}}<meta name="robots" content="noindex">{{/if}}
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preload" href="assets/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css?v={{assetVersion}}">
  <script>document.documentElement.classList.add("js");</script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "{{site.name}}",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Android, iOS, Windows, macOS, Web",
    "description": "{{site.description}}",
    "url": "{{site.url}}",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" }
  }
  </script>
</head>
<body class="page-{{page.nav}}">
  {{> icons}}
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="scroll-progress" aria-hidden="true"></div>
  {{> header}}
  <main id="main">
{{content}}
  </main>
  {{> footer}}
  <script src="assets/js/main.js?v={{assetVersion}}" defer></script>
</body>
</html>
